<main class="w-full max-w-md px-margin-mobile flex-1 flex flex-col">

<div>

<script>
        function setupStarRating(containerId, textContainerId, inputId) {
            const container = document.getElementById(containerId);
            if (!container) return;
            
            const stars = container.querySelectorAll('.material-symbols-outlined');
            const textDisplay = textContainerId ? document.getElementById(textContainerId) : null;
            const inputField = inputId ? document.getElementById(inputId) : null;
            
            const ratingTexts = ["Çok Kötü", "Kötü", "Ortalama", "İyi", "Mükemmel"];
            let currentRating = 0;

            stars.forEach(star => {
                star.addEventListener('click', (e) => {
                    currentRating = parseInt(e.target.dataset.value);
                    updateStars(stars, currentRating);
                    if (textDisplay) textDisplay.textContent = ratingTexts[currentRating - 1];
                    if (inputField) inputField.value = currentRating;
                });

                star.addEventListener('mouseenter', (e) => {
                    const hoverValue = parseInt(e.target.dataset.value);
                    updateStars(stars, hoverValue, true);
                });

                star.addEventListener('mouseleave', () => {
                    updateStars(stars, currentRating);
                });
            });
        }

        function updateStars(stars, value, isHover = false) {
            stars.forEach(star => {
                const starValue = parseInt(star.dataset.value);
                if (starValue <= value) {
                    star.style.fontVariationSettings = "'FILL' 1";
                    star.classList.remove('text-outline-variant');
                    star.classList.add('text-tertiary-fixed-dim'); // Gold/Orange color for active stars
                } else {
                    star.style.fontVariationSettings = "'FILL' 0";
                    star.classList.add('text-outline-variant');
                    star.classList.remove('text-tertiary-fixed-dim');
                }
            });
        }

        // Initialize ratings
        setupStarRating('shop-rating', 'shop-rating-text', 'shop_rating_input');
        setupStarRating('product-rating-1');
        setupStarRating('product-rating-2');
    </script>
