<!-- Micro-interaction Scripts -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const inputs = document.querySelectorAll('.otp-input');
            const verifyBtn = document.getElementById('verify-btn');
            
            // Focus first input on load
            setTimeout(() => inputs[0].focus(), 300);

            // Input handling logic
            inputs.forEach((input, index) => {
                input.addEventListener('input', (e) => {
                    // Ensure only 1 character is entered
                    if (input.value.length > 1) {
                        input.value = input.value.slice(0, 1);
                    }
                    
                    // Auto-advance
                    if (input.value.length === 1 && index < inputs.length - 1) {
                        inputs[index + 1].focus();
                    }
                    
                    checkCompletion();
                });

                input.addEventListener('keydown', (e) => {
                    // Backspace logic
                    if (e.key === 'Backspace' && input.value === '' && index > 0) {
                        inputs[index - 1].focus();
                    }
                });
                
                // Handle paste event
                input.addEventListener('paste', (e) => {
                    e.preventDefault();
                    const pastedData = e.clipboardData.getData('text').replace(/\D/g, '').slice(0, 4);
                    
                    if (pastedData) {
                        pastedData.split('').forEach((char, i) => {
                            if (inputs[i]) {
                                inputs[i].value = char;
                            }
                        });
                        
                        // Focus next empty input or last input
                        const nextEmptyIndex = Array.from(inputs).findIndex(inp => inp.value === '');
                        if (nextEmptyIndex !== -1) {
                            inputs[nextEmptyIndex].focus();
                        } else {
                            inputs[inputs.length - 1].focus();
                        }
                        
                        checkCompletion();
                    }
                });
            });

            // Check if all inputs are filled to activate button
            function checkCompletion() {
                const isComplete = Array.from(inputs).every(input => input.value.length === 1);
                if (isComplete) {
                    verifyBtn.disabled = false;
                    verifyBtn.classList.remove('bg-surface-variant', 'text-outline-variant', 'pointer-events-none');
                    verifyBtn.classList.add('bg-primary-container', 'text-on-primary', 'shadow-md', 'active:scale-95', 'hover:bg-primary', 'cursor-pointer', 'pointer-events-auto');
                } else {
                    verifyBtn.disabled = true;
                    verifyBtn.classList.add('bg-surface-variant', 'text-outline-variant', 'pointer-events-none');
                    verifyBtn.classList.remove('bg-primary-container', 'text-on-primary', 'shadow-md', 'active:scale-95', 'hover:bg-primary', 'cursor-pointer', 'pointer-events-auto');
                }
            }

            // Simple Timer Logic
            let timeLeft = 179; // 2:59
            const timerDisplay = document.getElementById('timer');
            const resendBtn = document.getElementById('resend-btn');
            
            const countdown = setInterval(() => {
                if (timeLeft <= 0) {
                    clearInterval(countdown);
                    timerDisplay.textContent = "00:00";
                    timerDisplay.classList.replace('text-on-surface', 'text-error');
                    
                    // Activate Resend Button
                    resendBtn.disabled = false;
                    resendBtn.classList.remove('text-outline-variant', 'cursor-not-allowed');
                    resendBtn.classList.add('text-primary', 'font-bold', 'cursor-pointer', 'hover:underline');
                } else {
                    let minutes = Math.floor(timeLeft / 60);
                    let seconds = timeLeft % 60;
                    timerDisplay.textContent = `${minutes < 10 ? '0' : ''}${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
                    timeLeft -= 1;
                }
            }, 1000);
            
            // Resend button interaction
            resendBtn.addEventListener('click', (e) => {
                if(!resendBtn.disabled) {
                    e.preventDefault();
                    // Provide visual feedback
                    resendBtn.textContent = "Kod Gönderildi!";
                    resendBtn.classList.replace('text-primary', 'text-secondary');
                    
                    // Reset inputs
                    inputs.forEach(input => input.value = '');
                    checkCompletion();
                    inputs[0].focus();
                }
            });
            
            // Verify button interaction (Demo)
            verifyBtn.addEventListener('click', () => {
                verifyBtn.innerHTML = '<span class="material-symbols-outlined animate-spin mr-2">progress_activity</span> İşleniyor...';
                verifyBtn.classList.add('opacity-80');
            });
        });
    </script>
