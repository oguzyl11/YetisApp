<img alt="TR Flag" class="w-5 h-auto rounded-sm opacity-90" data-alt="A small, crisp rectangular icon of the national flag of Turkey, featuring a white crescent moon and a five-pointed star centered on a solid crimson red background. The image is flat, well-lit, and serves as a simple user interface element to denote the country code selection in a phone number input field." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDilwT0FJfeBr9_JNWzxFLCJjzkJIsyCvWQYsJr1VBCXcSSOfVCDy2FmvLjSwvVSm-baFTnJfwPjN-rvY_eQZltWVkcdAYEnWDWTH1fhYBY4P5SjQnj4Za1VTJstfRCtQUCcGUTCC-b1wpyv93_3JL5u0NKyV_SG6FSNNkvkeZCF8dQ7fkaFJg1x7RnH1YGhG0stARD1JKckDVGDO68Vgz_pXmDmBaBVxgNqHUkVth2e-h4OrEhMMarH87L7cJPIsisLpi4HTGRcDaf"/>

</div>
</div>
