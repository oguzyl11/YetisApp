<!DOCTYPE html>

<html class="light" lang="tr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Kayıt Ol - Yetiş</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

                    "borderRadius": {

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface font-body-md min-h-screen flex flex-col items-center justify-center p-margin-mobile">
<main class="w-full max-w-[400px] bg-surface-container-lowest rounded-xl shadow-[0_4px_12px_rgba(0,0,0,0.05)] p-lg flex flex-col gap-lg border border-outline-variant/30">
<!-- Header -->
<div class="text-center">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary mb-xs">Hesap Oluştur</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Yetiş ailesine katılın ve israfı önlemeye başlayın.</p>
</div>
<!-- Form -->
<form class="flex flex-col gap-md">
<!-- Name Field -->
<div class="flex flex-col gap-base">
<label class="font-body-sm text-body-sm text-on-surface-variant" for="name">Ad Soyad</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline" data-icon="person">person</span>
<input class="w-full h-12 pl-10 pr-sm rounded-lg border border-outline-variant bg-surface-container-lowest focus:ring-2 focus:ring-primary focus:border-primary font-body-md text-body-md transition-shadow" id="name" placeholder="Adınız Soyadınız" type="text"/>
</div>
</div>
<!-- Phone Number Field -->
<div class="flex flex-col gap-base">
<label class="font-body-sm text-body-sm text-on-surface-variant" for="phone">Telefon Numarası</label>
<div class="flex gap-xs">
<div class="relative w-24">
<select class="w-full h-12 pl-sm pr-xs rounded-lg border border-outline-variant bg-surface-container-lowest focus:ring-2 focus:ring-primary focus:border-primary font-body-md text-body-md appearance-none" id="country-code">
<option value="+90">+90</option>
<option value="+1">+1</option>
<option value="+44">+44</option>
</select>
<span class="material-symbols-outlined absolute right-sm top-1/2 -translate-y-1/2 text-outline pointer-events-none" data-icon="arrow_drop_down">arrow_drop_down</span>
</div>
<div class="relative flex-1">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline" data-icon="phone_iphone">phone_iphone</span>
<input class="w-full h-12 pl-10 pr-sm rounded-lg border border-outline-variant bg-surface-container-lowest focus:ring-2 focus:ring-primary focus:border-primary font-body-md text-body-md transition-shadow" id="phone" placeholder="5XX XXX XX XX" type="tel"/>
</div>
</div>
</div>
<!-- Email Field (Optional) -->
<div class="flex flex-col gap-base">
<label class="font-body-sm text-body-sm text-on-surface-variant flex justify-between" for="email">
<span>E-posta</span>
<span class="text-subtle-text">(İsteğe bağlı)</span>
</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline" data-icon="mail">mail</span>
<input class="w-full h-12 pl-10 pr-sm rounded-lg border border-outline-variant bg-surface-container-lowest focus:ring-2 focus:ring-primary focus:border-primary font-body-md text-body-md transition-shadow" id="email" placeholder="ornek@email.com" type="email"/>
</div>
</div>
<!-- Terms Checkbox -->
<div class="flex items-start gap-sm mt-xs">
<input class="mt-1 w-5 h-5 rounded text-primary border-outline-variant focus:ring-primary" id="terms" type="checkbox"/>
<label class="font-body-sm text-body-sm text-on-surface-variant leading-tight" for="terms">
<a class="text-primary underline hover:text-primary-container transition-colors" href="#">Kullanım Koşullarını</a> ve <a class="text-primary underline hover:text-primary-container transition-colors" href="#">Gizlilik Politikasını</a> kabul ediyorum.
                </label>
</div>
<!-- Submit Button -->
<button class="w-full h-12 mt-xs bg-primary-container text-on-primary font-headline-md text-headline-md rounded-lg shadow-sm hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-xs" type="submit">
                Kayıt Ol
                <span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<!-- Footer -->
<div class="text-center pt-md border-t border-outline-variant/30">
<p class="font-body-md text-body-md text-on-surface-variant">
                Zaten hesabın var mı? 
                <a class="text-primary font-headline-md text-headline-md hover:underline" href="#">Giriş Yap</a>
</p>
</div>
</main>
</body></html>
