<!-- JavaScript for Countdown Timer -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const timerElement = document.getElementById('countdown-timer');
            let timeRemaining = 5 * 60; // 5 minutes in seconds

            const updateTimer = () => {
                const minutes = Math.floor(timeRemaining / 60);
                const seconds = timeRemaining % 60;
                
                // Format with leading zeros
                const formattedMinutes = String(minutes).padStart(2, '0');
                const formattedSeconds = String(seconds).padStart(2, '0');
                
                timerElement.textContent = `${formattedMinutes}:${formattedSeconds}`;

                if (timeRemaining > 0) {
                    timeRemaining--;
                } else {
                    // Handle expiration (e.g., show refresh button, turn text gray)
                    timerElement.textContent = "Süre Doldu";
                    timerElement.parentElement.classList.remove('animate-pulse-soft', 'text-primary-container', 'bg-surface-container-low');
                    timerElement.parentElement.classList.add('text-error', 'bg-error-container');
                    timerElement.previousElementSibling.textContent = "error"; // change icon
                    clearInterval(timerInterval);
                }
            };

            // Initial call
            updateTimer();
            // Start interval
            const timerInterval = setInterval(updateTimer, 1000);
        });
    </script>
